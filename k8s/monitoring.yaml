apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sentiment
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - sentiment
  selector:
    matchLabels:
      app: sentiment
      component: metrics
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 15s
